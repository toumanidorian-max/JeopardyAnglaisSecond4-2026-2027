<!-- ÉCRAN D'UNE QUESTION -->
<section id="question-screen" class="screen">
    <div class="question-card">
        <div id="q-category" class="q-category">CATEGORY</div>
        <div id="q-points" class="q-points">0 POINTS</div>

        <div class="clue-label">QUESTION:</div>
        <p id="q-text" class="q-text"></p>

        <button id="show-answer-btn" class="btn btn-primary" type="button">
            SHOW ANSWER
        </button>

        <div id="answer-box" class="answer-box hidden">
            <div class="answer-label">ANSWER:</div>
            <div id="a-text" class="answer-text"></div>
        </div>

        <div id="judge-buttons" class="button-row hidden">
            <button id="correct-btn" class="btn btn-correct" type="button">
                CORRECT
            </button>
            <button id="wrong-btn" class="btn btn-wrong" type="button">
                WRONG
            </button>
        </div>
    </div>
</section>
